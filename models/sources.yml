version: 2

sources:
  # Raw data from operational database
  - name: raw_data
    description: "Raw data from source systems loaded into Databricks"
    database: game  # Unity Catalog name
    schema: game_r6m_cert_dev_gold
    
    # Freshness checks - alerts if data is stale
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}

    tables:
      - name: bl_jaffle_shop_customers
        description: "Dimension Table concerning the Customers with their First and Last Name."
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 12, period: hour}
        columns:
          - name: id
            description: "Primary key for customers"
            tests:
              - unique
              - not_null
          
          - name: first_name
            description: "Customer First Name"
            tests:
              - not_null

          - name: last_name
            description: "Customer last name"


      - name: bl_jaffle_shop_orders
        description: "Raw order transactions from e-commerce platform"
        columns:
          - name: id
            description: "Primary key for orders"
            tests:
              - unique
              - not_null
          
          - name: user_id
            description: "Foreign key to customers"
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'bl_jaffle_shop_customers')
                  field: id
          
          - name: order_date
            description: "Date when order was placed"
            tests:
              - not_null
          
          - name: status
            description: "Order status"
            tests:
              - accepted_values:
                  values: ['placed', 'shipped', 'return_pending', 'completed', 'returned']

      
      - name: bl_stripe_payments
        description: "For every payment that was made "
        columns:
          - name: id
            description: "Primary key for payments"
            tests:
              - unique
              - not_null
          
          - name: orderid
            description: "Foreign key to orders"
            tests:
              - not_null
              - relationships:
                  to: source('raw_data', 'bl_jaffle_shop_orders')
                  field: id
          
          - name: paymentmethod
            description: "Method that was used for the payment"
            tests:
              - accepted_values:
                  values: [ 'credit_card', 'coupon', 'bank_transfer', 'gift_card' ]
          
          - name: status
            description: "Status of the Payment made."
            tests:
              - accepted_values:
                  values: [ 'success', 'fail' ]
          
          - name: amount
            description: "Total of the payment made"
            tests:
              - not_null

          - name: created
            description: "Time when the payment was made"
            tests:
              - not_null